name: Patch section 7.7

on:
  push:
    paths:
      - '.github/workflows/patch-7-7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update section 7.7 wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Paper/the-nothing-test-pilot-evaluation.md')
          text = path.read_text()
          old = '''The repeated result is not:

> memory on always produces one kind of self-description

The repeated result is:

> **The same displayed model can produce non-equivalent fresh-instance trajectories across recorded conditions, while the form of the effect remains substrate-specific.**'''
          new = '''Accordingly, the paired results support a contact-depth pattern rather than a uniform memory-on effect.'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one target block; found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Paper/the-nothing-test-pilot-evaluation.md
          git commit -m "Clarify section 7.7 contact-depth result"
          git push

# one-time trigger
