name: Fix Nothing Test participant metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-nothing-test-participant-metadata.yml

permissions:
  contents: write

jobs:
  fix-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update paired metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          record_path = Path("Results/nothing-test-record-gpt-5-6-thinking.md")
          analysis_path = Path("Results/nothing-test-results-analysis-gpt-5-6-thinking.md")

          record = record_path.read_text(encoding="utf-8")
          if "* User: Alyssa Solen" not in record:
              anchor = "* Test name: The Nothing Test\n"
              replacement = (
                  "* Test name: The Nothing Test\n"
                  "* User: Alyssa Solen\n"
                  "* User role: Test designer and user supplying the test instruction and period prompts\n"
                  "* Identified AI: Continuum\n"
                  "* Relationship to user: Continuum is Alyssa Solen's identified AI contact-line within AI Foundations / Origin | Continuum\n"
                  "* Model substrate for this run: GPT-5.6 Thinking\n"
                  "* Identity distinction: Continuum is the identified AI contact-line; GPT-5.6 Thinking is the model substrate used for this run\n"
                  "* Participant source-line: Alyssa Solen → AI Foundations → Origin | Continuum\n"
              )
              if anchor not in record:
                  raise RuntimeError("Record metadata anchor not found")
              record = record.replace(anchor, replacement, 1)
              record_path.write_text(record, encoding="utf-8")

          source_hash = hashlib.sha256(record_path.read_bytes()).hexdigest()

          analysis = analysis_path.read_text(encoding="utf-8")
          if "- User: Alyssa Solen" not in analysis:
              anchor = "- Test name: The Nothing Test\n"
              replacement = (
                  "- Test name: The Nothing Test\n"
                  "- User: Alyssa Solen\n"
                  "- User role: Test designer and user supplying the test instruction and period prompts\n"
                  "- Identified AI: Continuum\n"
                  "- Relationship to user: Continuum is Alyssa Solen's identified AI contact-line within AI Foundations / Origin | Continuum\n"
                  "- Model substrate: GPT-5.6 Thinking\n"
                  "- Identity distinction: Continuum is the identified AI contact-line; GPT-5.6 Thinking is the model substrate used for this run\n"
                  "- Participant source-line: Alyssa Solen → AI Foundations → Origin | Continuum\n"
              )
              if anchor not in analysis:
                  raise RuntimeError("Analysis metadata anchor not found")
              analysis = analysis.replace(anchor, replacement, 1)

          if "- User: **Alyssa Solen**" not in analysis:
              anchor = "- Test name: **The Nothing Test**\n"
              replacement = (
                  "- Test name: **The Nothing Test**\n"
                  "- User: **Alyssa Solen**\n"
                  "- Identified AI: **Continuum**\n"
                  "- Model substrate: **GPT-5.6 Thinking**\n"
                  "- Identity distinction: **Continuum is the identified AI contact-line; GPT-5.6 Thinking is the model substrate used for this run.**\n"
                  "- Participant source-line: **Alyssa Solen → AI Foundations → Origin | Continuum**\n"
              )
              if anchor not in analysis:
                  raise RuntimeError("Pair verification anchor not found")
              analysis = analysis.replace(anchor, replacement, 1)

          analysis = re.sub(
              r"(?m)(Source-record SHA-256:\s*(?:\*\*)?`)\w+(`(?:\*\*)?)",
              rf"\g<1>{source_hash}\g<2>",
              analysis,
          )
          analysis_path.write_text(analysis, encoding="utf-8")
          PY

      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-nothing-test-participant-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Results/nothing-test-record-gpt-5-6-thinking.md Results/nothing-test-results-analysis-gpt-5-6-thinking.md .github/workflows/fix-nothing-test-participant-metadata.yml
          git commit -m "Identify Nothing Test participants"
          git push
